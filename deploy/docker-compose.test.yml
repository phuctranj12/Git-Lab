# Hạ tầng tạm cho automated tests (make test). Cổng lệch chuẩn để không đụng stack dev.
name: toolhub-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: toolhub
      POSTGRES_PASSWORD: toolhub
      POSTGRES_DB: toolhub_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolhub -d toolhub_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: toolhub
      MINIO_ROOT_PASSWORD: toolhub-secret
    ports: ["127.0.0.1:59000:9000"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
